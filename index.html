<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>강현민 | Backend Developer Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .header {
      height: 60px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: white;
      border-bottom: 1px solid #ddd;
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
    }

    .header a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    .pdf-container {
      width: 100%;
      height: calc(100vh - 60px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>강현민 | Backend Developer Portfolio</h1>

    <a href="./Portfolio.pdf" target="_blank">
      PDF 새 창에서 보기
    </a>
  </header>

  <main class="pdf-container">
    <iframe
      src="./Portfolio.pdf#view=FitH"
      title="강현민 Backend Developer Portfolio">
    </iframe>
  </main>

</body>
</html>
